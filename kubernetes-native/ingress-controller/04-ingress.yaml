apiVersion: v1
kind: Namespace
metadata:
  name: test
  labels:
    app: webtest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webtest
  namespace: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webtest
  template:
    metadata:
      labels:
        app: webtest
    spec:
      containers:
      - name: webtest
        image: nginx:1.28-alpine-slim
        ports:
          - name: http
            containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: webtest
  namespace: test
spec:
  selector:
    app: webtest
  ports:
    - name: myjob
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webtest
  namespace: test
spec:
  ingressClassName: nginx
  rules:
    - host: "web.cando.com"
      http: # as tarighe PROTOCOL HTTP befret be service
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: webtest
                port:
                  number: 80

