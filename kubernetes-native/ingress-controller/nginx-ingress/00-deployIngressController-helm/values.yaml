controller:
  kind: daemonset 

  service:
    create: true
    type: ClusterIP 

  hostNetwork: true 
  
  hostPort:
    enable: true 
    http: 80

  containerPort:
    http: 80
    https: 443

prometheus:
  create: true
  port: 9113
  service:
    create: true
    labels:
      service: "nginx-ingress-prometheus-service"

  serviceMonitor:
    create: true
