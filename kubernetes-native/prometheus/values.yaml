    hosts: 
      - prom.cando.ac 
######################
crds:
  enabled: true
  upgradeJob:
    enabled: true 

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
      - receiver: 'null'
        matchers:
          - alertname = "Watchdog"
    receivers:
    - name: 'null'
    templates:
    - '/etc/alertmanager/config/*.tmpl'
  ingress:
    enabled: true 
    ingressClassName: nginx
    hosts:
      - alert.cando.ac
grafana:
  enabled: true
  defaultDashboardsEditable: true # if false bashad miad dar ezaye dashboardha configmap ijad mikonad ama true bashad dar DB khodesh save
  ingress:
    enabled: true 
    ingressClassName: nginx
    hosts:
      - grafana.cando.ac

kubelet:
  enabled: true
  namespace: kube-system

prometheusOperator:
  enabled: true

prometheus:
  enabled: true
  ingress:
    enabled: true 
    ingressClassName: "nginx"
    hosts:
      - prometheus.cando.ac
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false 
    podMonitorSelectorNilUsesHelmValues: false
    retention: 10d
    retentionSize:
    logFormat: logfmt
    logLevel: error

